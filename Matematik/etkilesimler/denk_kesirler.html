<title>Denk Kesirler Tahtası</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Düzen: üstte kesir eşitliği, ortada pasta + çubuk yan yana, altta üç kaydırıcı ve denk kesir şeridi */
:root {
  --bg: #eef2f6;
  --panel: #ffffff;
  --fg: #1d2733;
  --muted: #5b6878;
  --line: #c9d2dc;
  --edge: #1d2733;
  --fill: #f08a24;
  --fill-soft: #fde3c8;
  --accent: #2a6fdb;
  --empty: #f7f9fb;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a22; --panel: #1d2530; --fg: #e8edf3; --muted: #9aa7b6; --line: #3a4757;
    --edge: #e8edf3; --fill: #f59a3c; --fill-soft: #4a3220; --accent: #6ea0f0; --empty: #232c38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a22; --panel: #1d2530; --fg: #e8edf3; --muted: #9aa7b6; --line: #3a4757;
  --edge: #e8edf3; --fill: #f59a3c; --fill-soft: #4a3220; --accent: #6ea0f0; --empty: #232c38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; }
.sayfa { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(1.6rem, 3.5vw, 2.3rem); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }

.esitlik { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 3vw, 28px); flex-wrap: wrap; padding-block: 6px; }
.kesir { display: inline-grid; justify-items: center; font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.kesir span { padding: 0 .15em; }
.kesir .cizgi { width: 100%; height: .08em; min-height: 3px; background: currentColor; margin: .12em 0; border-radius: 2px; }
.kesir.buyuk { font-size: clamp(2.6rem, 8vw, 4.4rem); }
.kesir.ana { color: var(--muted); }
.kesir.yeni { color: var(--fill); }
.esit { font-family: var(--display); font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; color: var(--muted); }
.carpan { display: grid; justify-items: center; gap: 2px; font-family: var(--display); font-weight: 600; color: var(--accent); font-size: clamp(1rem, 2.4vw, 1.3rem); }
.carpan[hidden] { display: none !important; }

.sahne { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; }
.kart { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.kart h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kart svg { width: 100%; height: auto; display: block; }
.not { margin: 0; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.not b { color: var(--fg); }

.ayarlar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.ayar { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.ayar.vurgu { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent); }
.ayar label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
.ayar output { font-family: var(--display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--fg); }
.ayar.vurgu output { color: var(--accent); }
.ayar small { color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; }
input[type="range"]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.serit { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.serit > span { color: var(--muted); font-weight: 700; margin-right: 4px; }
.serit button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 10px; padding: 6px 12px; display: inline-grid; justify-items: center; font-family: var(--display); font-weight: 800; font-size: 1.05rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.serit button i { display: block; width: 100%; height: 2px; background: currentColor; margin: 3px 0; }
.serit button[aria-pressed="true"] { background: var(--fill); border-color: var(--fill); color: #fff; }
.serit button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.secenek { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); }
.secenek label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.secenek input { width: 18px; height: 18px; accent-color: var(--accent); }

@media (max-width: 760px) {
  .sahne, .ayarlar { grid-template-columns: minmax(0, 1fr); }
}
path, rect { transition: fill .25s ease; }
@media (prefers-reduced-motion: reduce) { path, rect { transition: none; } }
</style>

<div class="sayfa">
  <header>
    <h1>Denk Kesirler Tahtası</h1>
    <p>Kesri seç, sonra <b>“Her parçayı böl”</b> kaydırıcısını oyna. Parça sayısı değişir, boyalı alan hiç değişmez.</p>
  </header>

  <div class="esitlik" aria-live="polite">
    <div class="kesir buyuk ana"><span id="anaPay">3</span><div class="cizgi"></div><span id="anaPayda">4</span></div>
    <div class="carpan" id="carpanSol"><span>× <b id="k1">2</b></span><span>× <b id="k2">2</b></span></div>
    <div class="esit">=</div>
    <div class="kesir buyuk yeni"><span id="yeniPay">6</span><div class="cizgi"></div><span id="yeniPayda">8</span></div>
  </div>

  <div class="sahne">
    <section class="kart">
      <h2>Pasta</h2>
      <svg id="pasta" viewBox="0 0 220 220" role="img" aria-label="Pasta modeli"></svg>
      <p class="not" id="pastaNot"></p>
    </section>
    <section class="kart">
      <h2>Çubuk</h2>
      <svg id="cubuk" viewBox="0 0 400 90" role="img" aria-label="Çubuk modeli"></svg>
      <p class="not" id="cubukNot"></p>
      <svg id="cubukAna" viewBox="0 0 400 90" role="img" aria-label="Bölünmeden önceki çubuk"></svg>
      <p class="not" id="cubukAnaNot"></p>
    </section>
  </div>

  <div class="ayarlar">
    <div class="ayar">
      <label for="payda">Payda <output id="paydaCikti">4</output></label>
      <input type="range" id="payda" min="1" max="12" value="4">
      <small>Bütün kaç eş parçaya ayrılsın?</small>
    </div>
    <div class="ayar">
      <label for="pay">Pay <output id="payCikti">3</output></label>
      <input type="range" id="pay" min="0" max="4" value="3">
      <small>Kaç parça boyansın?</small>
    </div>
    <div class="ayar vurgu">
      <label for="bol">Her parçayı böl <output id="bolCikti">2</output></label>
      <input type="range" id="bol" min="1" max="6" value="2">
      <small>Her parça kaç küçük parçaya ayrılsın?</small>
    </div>
  </div>

  <div class="serit" id="serit"><span>Denk kesirler:</span></div>

  <div class="secenek">
    <label><input type="checkbox" id="anaCizgi" checked> İlk bölmeyi kalın çizgiyle göster</label>
    <label><input type="checkbox" id="anaGoster" checked> Bölünmeden önceki çubuğu da göster</label>
    <label><input type="checkbox" id="carpanGoster" checked> Çarpanı göster</label>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function pasta(svg, pay, payda, k, kalin) {
  svg.replaceChildren();
  const cx = 110, cy = 110, r = 100, n = payda * k, boyali = pay * k;
  const nokta = t => { const a = -Math.PI / 2 + t * 2 * Math.PI; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  if (n === 1) {
    svg.append(el("circle", { cx, cy, r, fill: boyali ? css("--fill") : css("--empty") }));
  } else {
    for (let i = 0; i < n; i++) {
      const [x1, y1] = nokta(i / n), [x2, y2] = nokta((i + 1) / n);
      svg.append(el("path", { d: `M${cx},${cy} L${x1},${y1} A${r},${r} 0 0 1 ${x2},${y2} Z`, fill: i < boyali ? css("--fill") : css("--empty") }));
    }
    for (let i = 0; i < n; i++) {
      const ana = i % k === 0;
      if (ana && kalin) continue;
      const [x, y] = nokta(i / n);
      svg.append(el("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: css("--edge"), "stroke-width": 1, "stroke-opacity": .55 }));
    }
    for (let i = 0; i < payda && kalin && payda > 1; i++) {
      const [x, y] = nokta(i / payda);
      svg.append(el("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: css("--edge"), "stroke-width": 3, "stroke-linecap": "round" }));
    }
  }
  svg.append(el("circle", { cx, cy, r, fill: "none", stroke: css("--edge"), "stroke-width": 3 }));
}

function cubuk(svg, pay, payda, k, kalin) {
  svg.replaceChildren();
  const x0 = 4, y0 = 8, w = 392, h = 74, n = payda * k, boyali = pay * k, p = w / n;
  for (let i = 0; i < n; i++)
    svg.append(el("rect", { x: x0 + i * p, y: y0, width: p + .4, height: h, fill: i < boyali ? css("--fill") : css("--empty") }));
  for (let i = 1; i < n; i++) {
    const ana = i % k === 0;
    svg.append(el("line", { x1: x0 + i * p, y1: y0, x2: x0 + i * p, y2: y0 + h, stroke: css("--edge"),
      "stroke-width": ana && kalin ? 3 : 1, "stroke-opacity": ana && kalin ? 1 : .55 }));
  }
  svg.append(el("rect", { x: x0, y: y0, width: w, height: h, rx: 4, fill: "none", stroke: css("--edge"), "stroke-width": 3 }));
}

function ciz() {
  const payda = +$("payda").value;
  $("pay").max = payda;
  const pay = Math.min(+$("pay").value, payda);
  $("pay").value = pay;
  const k = +$("bol").value, kalin = $("anaCizgi").checked;
  const n = payda * k, b = pay * k;

  $("paydaCikti").textContent = payda; $("payCikti").textContent = pay; $("bolCikti").textContent = k;
  $("anaPay").textContent = pay; $("anaPayda").textContent = payda;
  $("yeniPay").textContent = b; $("yeniPayda").textContent = n;
  $("k1").textContent = k; $("k2").textContent = k;
  $("carpanSol").hidden = !$("carpanGoster").checked;

  pasta($("pasta"), pay, payda, k, kalin);
  cubuk($("cubuk"), pay, payda, k, kalin);
  cubuk($("cubukAna"), pay, payda, 1, false);
  $("cubukAna").hidden = $("cubukAnaNot").hidden = !$("anaGoster").checked || k === 1;

  const metin = `<b>${n}</b> parçanın <b>${b}</b> tanesi boyalı`;
  $("pastaNot").innerHTML = metin;
  $("cubukNot").innerHTML = metin;
  $("cubukAnaNot").innerHTML = `Bölmeden önce: <b>${payda}</b> parçanın <b>${pay}</b> tanesi boyalı. Boyalı uzunluk aynı.`;

  const serit = $("serit");
  serit.querySelectorAll("button").forEach(x => x.remove());
  for (let i = 1; i <= 6; i++) {
    const bt = document.createElement("button");
    bt.type = "button";
    bt.setAttribute("aria-pressed", i === k);
    bt.setAttribute("aria-label", `${pay * i} bölü ${payda * i}`);
    bt.innerHTML = `<span>${pay * i}</span><i></i><span>${payda * i}</span>`;
    bt.onclick = () => { $("bol").value = i; ciz(); };
    serit.append(bt);
  }
}

["payda", "pay", "bol", "anaCizgi", "anaGoster", "carpanGoster"].forEach(id => $(id).addEventListener("input", ciz));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ciz);
new MutationObserver(ciz).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
ciz();
</script>
